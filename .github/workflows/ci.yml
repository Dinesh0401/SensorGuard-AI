name: Python research CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Code style (Ruff check)
        run: ruff check --output-format=github .
      - name: Code format (Ruff format)
        run: ruff format --check .
      - name: Database migration check
        run: alembic upgrade head
      - name: Unit and contract tests
        run: pytest -v --tb=short
      - name: Compile source
        run: python -m compileall -q src
      - name: Deterministic research smoke test
        run: python -m sensorguard.cli run-demo --mechanism mnar --seed 17 --output artifacts/benchmark.json
      - name: Store demonstration artifact
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-benchmark
          path: artifacts/benchmark.json

  # ── Frontend build & lint ──────────────────────────────────────────────────
  frontend:
    name: Next.js build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Type-check & build
        run: npm run build
