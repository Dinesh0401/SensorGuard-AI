name: PostgreSQL & Browser E2E Verification

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main, feat/*]

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sg_ci_postgres_password
          POSTGRES_DB: sensorguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d sensorguard"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"

      - name: Migrate SQLite pilot data to PostgreSQL & run integration suite
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:sg_ci_postgres_password@127.0.0.1:5432/sensorguard
          SENSORGUARD_TEST_POSTGRES_URL: postgresql+psycopg2://postgres:sg_ci_postgres_password@127.0.0.1:5432/sensorguard
        run: |
          python scripts/seed_pilot_db.py
          alembic upgrade head
          python scripts/migrate_sqlite_to_postgres.py
          ruff check src tests scripts alembic
          pytest tests/test_postgres_integration.py tests/test_api.py -v

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install frontend deps, audit, build, and Playwright Chromium
        run: |
          cd apps/web
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm run lint
          npm run build
          npx playwright install --with-deps chromium

      - name: Seed and migrate SQLite pilot database for E2E backend
        run: |
          python scripts/seed_pilot_db.py
          alembic upgrade head

      - name: Run Playwright E2E against live FastAPI + built web export
        run: |
          python scripts/run_browser_e2e.py
