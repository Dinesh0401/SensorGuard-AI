[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensorguard-ai"
version = "0.1.0"
description = "Reproducible sensor-outage calibration research and environmental monitoring foundations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "lightgbm>=4.0,<5",
  "mlflow>=3.0,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".venv", "scratch"]

[tool.ruff.lint]
ignore = ["EXE001"]
